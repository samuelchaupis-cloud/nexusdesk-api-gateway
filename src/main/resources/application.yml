server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4300"
                  - "http://127.0.0.1:4300"
                  - "http://localhost:4200"
                  - "http://127.0.0.1:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          discovery:
            locator:
              enabled: false
          routes: &routes_config
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/default

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customerCircuitBreaker
                    fallbackUri: forward:/fallback/customer

            - id: helpdesk-service
              uri: lb://helpdesk-service
              predicates:
                - Path=/api/helpdesk/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: helpdeskCircuitBreaker
                    fallbackUri: forward:/fallback/helpdesk

            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/api/operations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: operationsCircuitBreaker
                    fallbackUri: forward:/fallback/operations

            - id: crm-service
              uri: lb://crm-service
              predicates:
                - Path=/api/crm/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: crmCircuitBreaker
                    fallbackUri: forward:/fallback/crm

            - id: billing-service
              uri: lb://billing-service
              predicates:
                - Path=/api/billing/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: billingCircuitBreaker
                    fallbackUri: forward:/fallback/billing

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notificationCircuitBreaker
                    fallbackUri: forward:/fallback/notification
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4300"
              - "http://127.0.0.1:4300"
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: false
      routes: *routes_config

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:TechDeskProCloudEnterpriseSecurityKeyHS512SecretKeyVeryLongStringForCibertecAcademicProject2026SecureHash9876543210}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
